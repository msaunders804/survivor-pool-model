<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivor Pool — Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <div class="app">
    <nav class="pagenav">
      <a class="navbtn active" href="index.html">Board</a>
      <a class="navbtn" href="picks.html">Picks</a>
      <a class="navbtn" href="ownership.html">Availability</a>
      <a class="navbtn" href="results.html">Results</a>
      <a class="navbtn" href="update.html">Settings</a>
      <a class="navbtn" href="guide.html">Guide</a>
    </nav>
    <div id="app">Loading…</div>
</div>
<script src="auth.js"></script>
<script>
requireAuthOrRedirect();
const LEAGUE = 1;
let WEEK = 4;

async function load() {
  WEEK = await getCurrentWeek(LEAGUE);
  const [recRaw, cfg, entries, ownership, mu] = await Promise.all([
    authedFetch(`/leagues/${LEAGUE}/recommendation?week=${WEEK}`).then(r => r.ok ? r.json() : null),
    authedFetch(`/leagues/${LEAGUE}/config`).then(r => r.json()),
    authedFetch(`/leagues/${LEAGUE}/entries`).then(r => r.json()),
    authedFetch(`/leagues/${LEAGUE}/ownership?week=${WEEK}`).then(r => r.ok ? r.json() : []),
    getMatchups(LEAGUE, WEEK),
  ]);

  // No model run for this week yet: show the picks that were entered instead.
  const noRec = !recRaw;
  const rec = recRaw ?? {
    expected_total_payout: null, payout_se: null,
    picks: entries.filter(e => e.picks.some(p => p.week === WEEK))
                  .map(e => ({ entry_id: e.entry_id, team: e.picks.find(p => p.week === WEEK).team })),
  };

  const ownByTeam = Object.fromEntries(ownership.map(o => [o.team, o]));

  const byTeam = {};
  rec.picks.forEach(p => { (byTeam[p.team] ??= []).push(p.entry_id); });

  const confirmedByEntry = {};
  entries.forEach(e => {
    const wk = e.picks.find(p => p.week === WEEK);
    confirmedByEntry[e.entry_id] = wk ? wk.confirmed : false;
  });

  const cols = Object.entries(byTeam).map(([team, ids]) => {
    const own = ownByTeam[team];
    const ownLine = own && own.available != null
      ? `<div class="own">${Math.round(100 * own.available / own.n_alive)}% of live entries can still pick</div>`
      : own
      ? `<div class="own">${own.pct != null ? own.pct + "%" : ""}${own.pct != null && own.pick_count != null ? " · " : ""}${own.pick_count != null ? own.pick_count + " picks" : ""} of the league</div>`
      : `<div class="own dim">availability not pasted yet</div>`;
    return `
    <div class="col">
      <div class="tm">${team}</div>
      ${mu.known ? `<div class="opp">${mu.opponent(team)}<span>${lockText(mu.lock(team))}</span></div>` : ""}
      ${ownLine}
      <div class="chips">${ids.map(id => {
        return `<i class="chip">${id.replace("entry_", "BMJ")}</i>`;
      }).join("")}</div>
    </div>`;
  }).join("");

  // --- compare what was entered with what the model recommends ---
  const modelByEntry = Object.fromEntries(rec.picks.map(p => [p.entry_id, p.team]));
  const enteredByEntry = {};
  const outEntries = new Set();
  entries.forEach(e => {
    const wk = e.picks.find(p => p.week === WEEK);
    if (wk) enteredByEntry[e.entry_id] = wk.team;
    if (e.picks.some(p => p.survived === false)) outEntries.add(e.entry_id);
  });
  const aliveIds = entries.map(e => e.entry_id).filter(id => !outEntries.has(id));
  const label = id => id.replace("entry_", "BMJ");

  const cmpRows = aliveIds.map(id => {
    const entered = enteredByEntry[id], model = modelByEntry[id];
    let tag;
    if (!entered) tag = '<span class="tag none">Not entered</span>';
    else if (noRec || !model) tag = '<span class="tag none">No model pick</span>';
    else if (entered === model) tag = '<span class="tag same">Matches</span>';
    else tag = '<span class="tag diff">Differs</span>';
    return `<tr><td class="e">${label(id)}</td>
      <td>${entered ? mu.label(entered) : '<span class="dimtxt">—</span>'}${confirmedByEntry[id] ? ' <span class="confirmed" title="Entered on Splash">✓</span>' : ""}</td>
      <td>${model ? mu.label(model) : '<span class="dimtxt">—</span>'}</td><td>${tag}</td></tr>`;
  }).join("");

  const enteredIds = aliveIds.filter(id => enteredByEntry[id]);
  const differing = enteredIds.filter(id => modelByEntry[id] && modelByEntry[id] !== enteredByEntry[id]).length;
  const diffSummary = noRec ? `${enteredIds.length} picks entered`
    : differing === 0 ? `all ${enteredIds.length} entered picks match`
    : `${differing} of ${enteredIds.length} entered picks differ`;

  // --- this week's to-do list, in the order the week runs ---
  const prev = WEEK - 1;
  const pendingPrev = entries.filter(e => e.picks.some(p => p.week === prev && p.survived == null)).length;
  const pastedAvail = ownership.some(o => o.available != null);
  const firstLock = aliveIds.map(id => mu.lock(enteredByEntry[id] || modelByEntry[id])).filter(Boolean).sort((a, b) => a - b)[0];
  const steps = [];
  if (prev >= cfg.week_start) steps.push(pendingPrev === 0
    ? { done: true, text: `Week ${prev} results recorded` }
    : { done: false, text: `Week ${prev} results — ${pendingPrev} pick${pendingPrev > 1 ? "s" : ""} waiting on a final score`, href: "results.html", go: "Results" });
  if (WEEK > cfg.week_start) steps.push(pastedAvail
    ? { done: true, text: `Availability report pasted${cfg.n_rivals ? ` (${cfg.n_rivals.toLocaleString()} live entries)` : ""}` }
    : { done: false, text: "Paste Splash's availability report", href: "ownership.html", go: "Availability" });
  steps.push(noRec
    ? { done: false, text: "Model runs Wednesday at noon ET", wait: true }
    : { done: true, text: "Model has run for this week" });
  // Not a to-do: the model's picks are already saved. Brent only acts if he goes a different way.
  if (!noRec) steps.push({ info: true,
    text: `Enter picks on Splash${firstLock ? ` before ${lockText(firstLock)}` : ""}. The model's picks are already saved here, so only change one on Picks if you choose a different team`,
    href: "picks.html", go: "Picks" });
  const checklist = `<ol class="checklist">${steps.map(st => `
    <li class="${st.done ? "done" : st.info ? "info" : st.wait ? "wait" : "todo"}"><span class="mark"></span><span>${st.text}</span>
      ${st.href ? `<a href="${st.href}">${st.go} →</a>` : ""}</li>`).join("")}</ol>`;

  document.getElementById("app").innerHTML = `
    <h1>Week ${WEEK}</h1>
    <p class="lede">${noRec ? "Picks entered · no model recommendation yet" : "The model’s recommended picks for your live entries"}</p>
    ${checklist}
    <div class="stats">
      <div class="stat"><div class="k">Your entries alive</div><div class="v">${aliveIds.length}<small> / ${entries.length}</small></div></div>
      <div class="stat"><div class="k">Live entries</div><div class="v">${cfg.n_rivals.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Pot</div><div class="v">$${cfg.pot.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Pool weeks</div><div class="v">${cfg.week_start}–${cfg.week_end}</div></div>
    </div>

    <h2>${noRec ? "Picks by team" : "Model's recommendation by team"}</h2>
    <p class="hint">${noRec ? "The teams you entered." : "How the model would spread your entries across teams."}</p>
    <div class="cols">${cols}</div>
    <div class="side">
      <div class="eyebrow">Model's expected payout</div>
      <div class="big">${rec.expected_total_payout != null ? "$" + rec.expected_total_payout.toFixed(2) : "—"}</div>
      <div class="kv"><span>Standard error</span><b>${rec.payout_se != null ? "± $" + rec.payout_se.toFixed(2) : "—"}</b></div>
      ${rec.win_probability != null ? `<div class="kv"><span>Chance of any payout</span><b>${(rec.win_probability * 100).toFixed(1)}%</b></div>` : ""}
      ${rec.objective ? `<div class="kv"><span>Optimized for</span><b>${rec.objective === "win_probability" ? "chance of any payout" : "expected payout"}</b></div>` : ""}
      <div class="sub">${noRec ? "Shows once the weekly job has run." : "For the model's picks above, not necessarily the ones entered. Uses the latest availability paste and the pot in Settings."}</div>
    </div>
    <details class="cmpbox">
      <summary>Entered vs. the model <span class="dimtxt">· ${diffSummary}</span></summary>
      <p class="hint">What's been picked for each live entry, next to what the model recommends. ✓ = entered on Splash.</p>
      <div class="tablewrap"><table class="cmp">
        <thead><tr><th>Entry</th><th>Entered</th><th>Model says</th><th></th></tr></thead>
        <tbody>${cmpRows}</tbody>
      </table></div>
    </details>`;
}

load().catch(err => {
  document.getElementById("app").innerHTML =
    `<p class="err">Couldn't load — is the API running at ${API}? (${err})</p>`;
});
</script>
</body>
</html>
