<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainò — log in</title>
<style>
body{margin:0;background:#0c1020;color:#e9ecf6;font-family:Archivo,Arial,sans-serif;
  display:grid;place-items:center;min-height:100vh}
.card{width:100%;max-width:340px;padding:28px 24px;background:#141a2e;border:1px solid #242c46;
  border-radius:14px;box-sizing:border-box}
h1{font-size:19px;margin:0 0 18px}
input{width:100%;background:#1b2238;border:1px solid #323c5c;color:#e9ecf6;border-radius:8px;
  padding:11px 12px;font-size:16px;font-family:inherit;box-sizing:border-box;margin-bottom:12px}
button{width:100%;background:#ffb648;color:#0c1020;border:0;border-radius:8px;padding:12px;
  font-size:15px;font-weight:700;cursor:pointer}
.err{color:#e2635a;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>Trainò</h1>
  <input id="pw" type="password" placeholder="Password" autofocus>
  <button id="go">Log in</button>
  <div class="err" id="err"></div>
</div>
<script src="auth.js"></script>
<script>
async function attempt() {
  const err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  err.textContent = "";
  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    if (!res.ok) { err.textContent = "Wrong password."; return; }
    const { token } = await res.json();
    localStorage.setItem("trainò_token", token);
    window.location.href = "index.html";
  } catch (e) {
    err.textContent = `Couldn't reach the server: ${e}`;
  }
}
document.getElementById("go").addEventListener("click", attempt);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
</script>
</body>
</html>
