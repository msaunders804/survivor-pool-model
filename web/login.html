<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivor Pool — log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body class="login">
<div class="card">
  <h1>Survivor Pool</h1>
  <input id="pw" type="password" placeholder="Password" autofocus>
  <button id="go">Log in</button>
  <div class="err" id="err"></div>
</div>
<script src="auth.js"></script>
<script>
async function attempt() {
  const err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  err.textContent = "";
  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    if (!res.ok) { err.textContent = "Wrong password."; return; }
    const { token } = await res.json();
    localStorage.setItem("trainò_token", token);
    window.location.href = "index.html";
  } catch (e) {
    err.textContent = `Couldn't reach the server: ${e}`;
  }
}
document.getElementById("go").addEventListener("click", attempt);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
</script>
</body>
</html>
