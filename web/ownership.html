<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainò — league ownership</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<style>.wrap{max-width:680px}</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <nav class="pagenav">
      <a class="navbtn" href="index.html">Board</a>
      <a class="navbtn" href="picks.html">Picks</a>
      <a class="navbtn active" href="ownership.html">Ownership</a>
      <a class="navbtn" href="results.html">Results</a>
      <a class="navbtn" href="update.html">This week's numbers</a>
      <a class="navbtn" href="guide.html">Guide</a>
    </nav>
    <h1>League ownership — Week <span id="wk"></span></h1>
    <p class="sub">Paste from Splash's Stats tab — team name, then percentage and/or count, one per line.
      Handles "Chiefs 39% 948", "KC 948", or just "Chiefs 39%" — whatever's actually on the screen.</p>
    <label for="raw">Paste here</label>
    <textarea id="raw" placeholder="Chiefs 39% 948&#10;Seahawks 14% 343&#10;Lions 10% 252"></textarea>
    <button id="save">Save</button>
    <div class="status" id="status"></div>

    <table id="results" style="display:none">
      <thead><tr><th>Team</th><th>Pick %</th><th>Count</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script src="auth.js"></script>
<script>
requireAuthOrRedirect();
const LEAGUE = 1;
let WEEK = 4;
const weekReady = getCurrentWeek(LEAGUE).then(w => { WEEK = w; document.getElementById("wk").textContent = w; });

async function loadExisting() {
  await weekReady;
  const res = await authedFetch(`/leagues/${LEAGUE}/ownership?week=${WEEK}`);
  const rows = await res.json();
  if (rows.length) renderTable(rows);
}

function renderTable(rows) {
  rows.sort((a, b) => (b.pick_count ?? b.pct ?? 0) - (a.pick_count ?? a.pct ?? 0));
  document.getElementById("rows").innerHTML = rows.map(r => `
    <tr><td class="tm">${r.team}</td><td>${r.pct != null ? r.pct + "%" : "—"}</td>
    <td>${r.pick_count ?? "—"}</td></tr>`).join("");
  document.getElementById("results").style.display = "table";
}

document.getElementById("save").addEventListener("click", async () => {
  await weekReady;
  const status = document.getElementById("status");
  status.textContent = "Saving…"; status.className = "status";
  try {
    const res = await authedFetch(`/leagues/${LEAGUE}/ownership`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ week: WEEK, raw_text: document.getElementById("raw").value }),
    });
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    status.textContent = `Saved ${rows.length} teams.`; status.className = "status ok";
    renderTable(rows);
  } catch (err) {
    status.textContent = `Failed: ${err}`; status.className = "status err";
  }
});

loadExisting().catch(() => {});
</script>
</body>
</html>
