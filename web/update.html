<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainò — update this week's numbers</title>
<style>
body{margin:0;background:#0c1020;color:#e9ecf6;font-family:Archivo,Arial,sans-serif;font-size:15px}
.wrap{max-width:420px;margin:0 auto;padding:32px 20px}
h1{font-size:20px;margin:0 0 6px}
p{color:#9aa4c4;font-size:13px;margin:0 0 22px}
label{display:block;font-size:12.5px;color:#9aa4c4;margin:14px 0 5px}
input{width:100%;background:#1b2238;border:1px solid #323c5c;color:#e9ecf6;border-radius:8px;
  padding:10px 12px;font-size:16px;font-family:inherit;box-sizing:border-box}
button{width:100%;margin-top:20px;background:#ffb648;color:#0c1020;border:0;border-radius:8px;
  padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.status{margin-top:14px;font-size:13px;min-height:18px}
.ok{color:#4fc79a} .err{color:#e2635a}
.pagenav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.navbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--fg-2);text-decoration:none;
  font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px}
.navbtn:hover{border-color:var(--you);color:var(--you)}
.navbtn.active{background:var(--you-dim);border-color:var(--you);color:var(--you)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="pagenav">
      <a class="navbtn" href="index.html">Board</a>
      <a class="navbtn" href="picks.html">Picks</a>
      <a class="navbtn" href="ownership.html">Ownership</a>
      <a class="navbtn active" href="update.html">This week's numbers</a>
    </nav>
  <h1>This week's pool numbers</h1>
  <p>Whatever's in here is what the Saturday-night run uses automatically — nobody has to type it into a command. Bump the week once Monday's game is decided; update the count as your close-to-final number comes in.</p>

  <label for="week">Current week</label>
  <input id="week" type="number" inputmode="numeric">

  <label for="n">Entries still alive</label>
  <input id="n" type="number" inputmode="numeric">

  <label for="pot">Pot ($)</label>
  <input id="pot" type="number" inputmode="decimal" step="0.01">

  <button id="save">Save</button>
  <div class="status" id="status"></div>
</div>
<script src="auth.js"></script>
<script>
requireAuthOrRedirect();
const LEAGUE = 1;

async function load() {
  const cfg = await authedFetch(`/leagues/${LEAGUE}/config`).then(r => r.json());
  document.getElementById("week").value = cfg.current_week;
  document.getElementById("n").value = cfg.n_rivals;
  document.getElementById("pot").value = cfg.pot;
}

document.getElementById("save").addEventListener("click", async () => {
  const status = document.getElementById("status");
  status.textContent = "Saving…"; status.className = "status";
  try {
    const res = await authedFetch(`/leagues/${LEAGUE}/config`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        current_week: parseInt(document.getElementById("week").value, 10),
        n_rivals: parseInt(document.getElementById("n").value, 10),
        pot: parseFloat(document.getElementById("pot").value),
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    status.textContent = "Saved — this is what the next run will use.";
    status.className = "status ok";
  } catch (err) {
    status.textContent = `Couldn't save: ${err}`;
    status.className = "status err";
  }
});

load().catch(err => {
  document.getElementById("status").textContent = `Couldn't load current numbers: ${err}`;
  document.getElementById("status").className = "status err";
});
</script>
</body>
</html>
