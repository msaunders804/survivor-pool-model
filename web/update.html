<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivor Pool — update this week's numbers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<style>.wrap{max-width:480px}</style>
</head>
<body>
<div class="wrap"><div class="app">
  <nav class="pagenav">
      <a class="navbtn" href="index.html">Board</a>
      <a class="navbtn" href="picks.html">Picks</a>
      <a class="navbtn" href="ownership.html">Ownership</a>
      <a class="navbtn" href="results.html">Results</a>
      <a class="navbtn active" href="update.html">This week's numbers</a>
      <a class="navbtn" href="guide.html">Guide</a>
    </nav>
  <h1>This week's pool numbers</h1>
  <p>Whatever's in here is what the Wednesday-noon run uses automatically — nobody has to type it into a command. Bump the week once Monday's game is decided, and update the count and pot from Splash before Wednesday.</p>

  <label for="week">Current week</label>
  <input id="week" type="number" inputmode="numeric">

  <label for="n">Entries still alive</label>
  <input id="n" type="number" inputmode="numeric">

  <label for="pot">Pot ($)</label>
  <input id="pot" type="number" inputmode="decimal" step="0.01">

  <button id="save">Save</button>
  <div class="status" id="status"></div>
</div></div>
<script src="auth.js"></script>
<script>
requireAuthOrRedirect();
const LEAGUE = 1;

async function load() {
  const cfg = await authedFetch(`/leagues/${LEAGUE}/config`).then(r => r.json());
  document.getElementById("week").value = cfg.current_week;
  document.getElementById("n").value = cfg.n_rivals;
  document.getElementById("pot").value = cfg.pot;
}

document.getElementById("save").addEventListener("click", async () => {
  const status = document.getElementById("status");
  status.textContent = "Saving…"; status.className = "status";
  try {
    const res = await authedFetch(`/leagues/${LEAGUE}/config`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        current_week: parseInt(document.getElementById("week").value, 10),
        n_rivals: parseInt(document.getElementById("n").value, 10),
        pot: parseFloat(document.getElementById("pot").value),
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    status.textContent = "Saved — this is what the next run will use.";
    status.className = "status ok";
  } catch (err) {
    status.textContent = `Couldn't save: ${err}`;
    status.className = "status err";
  }
});

load().catch(err => {
  document.getElementById("status").textContent = `Couldn't load current numbers: ${err}`;
  document.getElementById("status").className = "status err";
});
</script>
</body>
</html>
